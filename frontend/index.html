<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarion</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 14px 16px; background: #111; color: #fff; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; word-wrap: break-word; }
  .user { align-self: flex-end; background: #111; color: #fff; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #e4e4e7; }
  form { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #e4e4e7; }
  input { flex: 1; padding: 12px; border: 1px solid #d4d4d8; border-radius: 10px; font-size: 16px; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: #111; color: #fff; font-size: 16px; }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<header>Clarion</header>
<div id="chat">
  <div class="msg bot">Hi, I am Clarion. Ask me anything and I will give you a clear answer.</div>
</div>
<form id="form">
  <input id="q" placeholder="Type your question..." autocomplete="off">
  <button id="send" type="submit">Send</button>
</form>
<script>
  var chat = document.getElementById("chat");
  var form = document.getElementById("form");
  var input = document.getElementById("q");
  var send = document.getElementById("send");

  function format(text) {
    var safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
  }

  function add(text, who, html) {
    var div = document.createElement("div");
    div.className = "msg " + who;
    if (html) { div.innerHTML = format(text); } else { div.textContent = text; }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var question = input.value.trim();
    if (!question) return;
    add(question, "user", false);
    input.value = "";
    send.disabled = true;
    var thinking = add("Thinking...", "bot", false);
    try {
      var res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question })
      });
      var data = await res.json();
      thinking.innerHTML = format(data.answer || data.error || "Something went wrong.");
    } catch (err) {
      thinking.textContent = "Network error. Please try again.";
    }
    send.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  });
</script>
</body>
</html>
